[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civil-code-rag"
version = "0.1.0"
description = "RAG pipeline + retrieval evaluation over the Civil Code of the PRC (民法典): 3 chunking strategies x rerank grid, keyless retrieval metrics, citation-grounded generation with low-confidence refusal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xuening Pi" }]
keywords = ["rag", "retrieval-augmented-generation", "evaluation", "chinese", "legal-nlp"]
dependencies = [
    "numpy>=1.26",
    "chromadb>=0.5",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3"]
llm = ["openai>=1.40"]
ragas = ["ragas>=0.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ccr-ask = "civil_code_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civil_code_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
